name: Release

# Builds the desktop installers (Windows, macOS, Linux) and the Android APK.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # Set these repository secrets to publish a signed release APK. Without them only a
      # debug APK is built (workflow artifact for testing; it is never attached to the release).
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: android-release-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*.apk
      - name: Build debug APK (testing only)
        if: env.KEYSTORE_B64 == ''
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 == ''
        with:
          name: android-debug-apk-testing-only
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk

  publish:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Only desktop installers and a signed release APK are published; never the debug APK.
          pattern: '{desktop-*,android-release-apk}'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          generate_release_notes: true
